<title>أملاكي - إدارة الإيجارات</title>
<style>
:root{--g:#0f5c4d;--g2:#e3f1ec;--gold:#b8862a;--red:#c0392b;--red2:#fdecea;--org:#c56a00;--org2:#fff2dc;--bg:#f3f5f4;--txt:#16211d;--mut:#5a6863;--fs:18px}
html{font-size:var(--fs)}
html.big{--fs:21px}
html.xbig{--fs:24px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:120px;line-height:1.6}
header{background:var(--g);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:1.45rem}
header p{opacity:.85;font-size:.85rem}
.gear{width:60px;height:60px;border:none;border-radius:16px;background:rgba(255,255,255,.18);color:#fff;font-size:1.7rem}
main{padding:16px;max-width:720px;margin:auto}
.sec{font-size:1.15rem;font-weight:800;margin:22px 4px 10px}
.mut{color:var(--mut);font-size:.92rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);border-right:7px solid var(--g)}
.stat span{font-size:.9rem;color:var(--mut);font-weight:700}
.stat b{display:block;font-size:1.45rem}
.stat.red{border-color:var(--red)}.stat.red b{color:var(--red)}
.stat.org{border-color:var(--org)}
.stat.gold{border-color:var(--gold)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{min-height:118px;border:none;border-radius:20px;background:var(--g);color:#fff;font-size:1.08rem;font-weight:800;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 3px 10px rgba(15,92,77,.25)}
.act .ic{font-size:2.2rem}
.act.gold{background:var(--gold)}
.act.lt{background:#fff;color:var(--g);border:3px solid var(--g)}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.card.soft{background:var(--g2);box-shadow:none}
.card.late{border-right:7px solid var(--red)}
.card.soon{border-right:7px solid var(--org)}
.card.paid{border-right:7px solid var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{margin-top:8px}
.nm{font-size:1.12rem;font-weight:800}
.amt{font-size:1.25rem;font-weight:800;white-space:nowrap}
.btn{min-height:58px;border:none;border-radius:14px;font-size:1rem;font-weight:800;font-family:inherit;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer}
.btn.full{width:100%;margin-top:12px}
.btn.big{min-height:66px;font-size:1.15rem}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.btns .btn{flex:1}
.b-g{background:var(--g);color:#fff}
.b-w{background:#1fa855;color:#fff}
.b-l{background:var(--g2);color:var(--g)}
.b-r{background:var(--red2);color:var(--red)}
.b-gold{background:var(--gold);color:#fff}
.tag{display:inline-block;padding:4px 12px;border-radius:30px;font-size:.85rem;font-weight:800;white-space:nowrap}
.t-red{background:var(--red2);color:var(--red)}

<body>

<header>
  <div class="hwrap"><img class="applogo hlogo" alt=""><div><h1>أملاكي</h1><p id="hdrDate"></p></div></div>
  <div style="display:flex;gap:8px"><button class="gear" onclick="lockNow()" aria-label="قفل">🔒</button><button class="gear" onclick="settings()" aria-label="الإعدادات">⚙️</button></div>
</header>

<nav>
  <button data-t="home" onclick="go('home')"><span class="ic">🏠</span>الرئيسية</button>
  <button data-t="props" onclick="go('props')"><span class="ic">🏢</span>العقارات</button>
  <button data-t="tenants" onclick="go('tenants')"><span class="ic">👥</span>المستأجرون</button>

  <div class="sh-head"><button class="x" onclick="closeAll()">✕</button><h2 id="shT"></h2></div>
  <div id="shB" class="sh-body"></div>
</div>

<div id="viewer"><div class="vimg"><img id="vImg" alt="" onclick="this.classList.toggle('z')"><div id="vPdf" class="vpdf" style="display:none"></div></div>
  <div class="vbar"><button class="btn b-l" style="flex:1" onclick="closeViewer()">✕ إغلاق</button><button id="vDel" class="btn b-r">🗑️ حذف</button></div></div>
<div id="lock"><div class="lbox"><img class="applogo llogo" alt=""><h2>أملاكي</h2><p class="mut">إدارة العقارات والإيجارات</p><div id="lockBody"></div></div></div>
<div id="lic"><div class="lbox"><img class="applogo llogo" alt=""><h2>تفعيل أملاكي</h2><div id="licBody"></div></div></div>
<div id="toast"></div>

<script>
/* ========== البيانات ========== */
const KEY='amlaki_v1';
const EMPTY=()=>({props:[],tenants:[],contracts:[],inst:[],legal:[],settings:{fs:''}});
let D=load();
let tab='home', payFilter='late', ctx=null;
const UTYPES=['شقة','محل تجاري','مكتب','مستودع / مخزن','معرض','فيلا','منزل','غرفة','أرض','أخرى'];
const ICON={'شقة':'🏠','محل تجاري':'🏪','مكتب':'💼','مستودع / مخزن':'📦','معرض':'🛍️','فيلا':'🏡','منزل':'🏘️','غرفة':'🚪','أرض':'🌳','أخرى':'🔑'};
const ic=t=>ICON[t]||'🔑';

function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.props?fix(x):EMPTY()}catch(e){return EMPTY()}}
function fix(x){x.legal=x.legal||[];x.settings=x.settings||{fs:''};x.props.forEach(p=>p.units.forEach(u=>{u.type=u.type||'أخرى'}));return x}
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const P=id=>D.props.find(x=>x.id===id);
const T=id=>D.tenants.find(x=>x.id===id);
const C=id=>D.contracts.find(x=>x.id===id);
const I=id=>D.inst.find(x=>x.id===id);
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

/* ========== التواريخ والأرقام ========== */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>ymd(new Date());
function addMonths(s,n){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1+n,1);const last=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();dt.setDate(Math.min(d,last));return ymd(dt)}
function days(a,b){return Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5)}
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:3})+' د.أ';
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const FREQ={1:'شهرياً',2:'كل شهرين',3:'كل 3 أشهر',4:'كل 4 أشهر',6:'كل 6 أشهر',12:'سنوياً'};
function opts(list,sel){return list.map(o=>{const v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(t)}</option>`}).join('')}
function unitName(p,uid){if(!p)return'';const u=p.units.find(x=>x.id===uid);return u?u.name:''}
function activeContract(unitId){return D.contracts.find(c=>c.uid===unitId&&c.end>today())}
function waNum(p){p=String(p).replace(/\D/g,'');if(p.startsWith('00'))p=p.slice(2);if(p.startsWith('0'))p='962'+p.slice(1);return p}

/* ========== العرض العام ========== */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.getElementById('main').innerHTML={home:vHome,props:vProps,tenants:vTenants,contracts:vContracts,pay:vPay}[tab]();
}
function go(t){tab=t;ctx=null;render();window.scrollTo(0,0)}
function openSheet(title,html){document.getElementById('shT').textContent=title;document.getElementById('shB').innerHTML=html;document.getElementById('sheet').classList.add('open');document.getElementById('shB').scrollTop=0}
function closeSheet(){document.getElementById('sheet').classList.remove('open')}
function closeAll(){ctx=null;closeSheet()}
function after(msg){save();render();if(ctx)ctx();else closeSheet();if(msg)toast(msg)}
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2600)}
function emptyBox(ic,txt,btn){return`<div class="card empty"><span class="ic">${ic}</span><p>${txt}</p>${btn||''}</div>`}

/* ========== حالة الدفعة ========== */
function st(i){if(i.paid)return'paid';const d=days(today(),i.due);if(d<0)return'late';if(d<=7)return'soon';return'up'}
function tagOf(i){
  if(i.paid)return`<span class="tag t-g">مدفوعة ✔</span>`;
  const d=days(today(),i.due);
  if(d<0)return`<span class="tag t-red">متأخرة ${-d} يوم</span>`;
  if(d===0)return`<span class="tag t-org">مستحقة اليوم</span>`;
  if(d<=7)return`<span class="tag t-org">بعد ${d} أيام</span>`;
  return`<span class="tag t-gr">بعد ${d} يوم</span>`;
}
function instCard(i){
  const c=C(i.cid);if(!c)return'';
  const t=T(c.tid),p=P(c.pid),s=st(i);
  const chk=i.method==='شيك'?` • 🧾 شيك${i.checkNo?' رقم '+esc(i.checkNo):''}${i.bank?' - '+esc(i.bank):''}`:'';
  let btns;
  if(i.paid){
    btns=`<p class="mut mt">دُفعت ${money(i.paidAmount)} بتاريخ ${fmtDate(i.paidDate)} (${esc(i.payMethod||'')})</p>
    <div class="btns"><button class="btn b-l" onclick="unpay('${i.id}')">↩️ إلغاء تسجيل الدفع</button></div>`;
  }else{
    btns=`<div class="btns"><button class="btn b-g big" onclick="payForm('${i.id}')">✅ تم الدفع</button>
    ${t&&t.phone?`<button class="btn b-w" onclick="remind('${i.id}')">💬 تذكير</button><a class="btn b-l" href="tel:${esc(t.phone)}">📞 اتصال</a>`:''}</div>
    <div class="btns"><button class="btn b-l" onclick="instEdit('${i.id}')">✏️ تعديل الدفعة</button></div>`;
  }
  return`<div class="card ${s}">
    <div class="row"><div><div class="nm">${esc(t?t.name:'—')}</div><div class="mut">${esc(p?p.name:'')} • ${esc(unitName(p,c.uid))}</div></div><div style="text-align:end"><div class="amt">${money(i.amount)}</div>${i.svc?`<div class="mut" style="font-size:.78rem">إيجار ${money(i.amount-i.svc)} + خدمات ${money(i.svc)}</div>`:''}</div></div>
    <div class="row mt"><div class="mut">📅 ${fmtDate(i.due)}${chk}</div>${tagOf(i)}</div>${btns}</div>`;
}

/* ========== الرئيسية ========== */
function vHome(){
  const warn=isOwner()&&D.settings.pw&&!D.settings.rec?`<div class="card warn" style="text-align:start"><div class="nm">⚠️ لم تُنشئ رمز استعادة لكلمة السر</div><p>إذا نسيت كلمة السر لن تستطيع الدخول. أنشئ الرمز وأرسله إلى واتساب الخاص بك.</p><button class="btn b-g full" onclick="settings()">🔑 إنشاء الرمز الآن</button></div>`:'';
  return licBanner()+warn+homeBody()+(isOwner()?`<button class="btn b-r full big" style="margin-top:34px" onclick="wipeAsk()">🗑️ مسح جميع البيانات</button>`:'')+
  `<button class="btn b-l full big" style="margin-top:22px" onclick="guideSheet()">📖 دليل استخدام التطبيق</button><div class="credit"><p>تطوير: <b class="notr" dir="ltr">Dahshan Soft</b></p><a class="btn b-w full big" href="https://wa.me/962779221235" target="_blank" style="flex-direction:column;gap:0;padding:8px">💬 تواصل عبر واتساب<span dir="ltr" style="font-size:.95rem;opacity:.95">00962779221235</span></a></div>`}
function homeData(){
  const td=today(),ym=td.slice(0,7);
  return{td,
    late:D.inst.filter(i=>!i.paid&&i.due<td).sort((a,b)=>a.due.localeCompare(b.due)),
    month:D.inst.filter(i=>!i.paid&&i.due>=td&&i.due.slice(0,7)===ym).sort((a,b)=>a.due.localeCompare(b.due)),

    ending:D.contracts.filter(c=>{const d=days(td,c.end);return d>0&&d<=30}).sort((a,b)=>a.end.localeCompare(b.end))};
}

function defLease(){const s=today();return{tname:'',tphone:'',amount:'',basis:'y',freq:1,start:s,end:addMonths(s,12),method:'نقدي',imgs:[],svc:'',svcBasis:'y'}}
function drawUnits(){
  document.getElementById('ucnt').textContent=tmpUnits.length;
  document.getElementById('ulist').innerHTML=tmpUnits.length?tmpUnits.map((u,k)=>{
    const c=activeContract(u.id),t=c&&T(c.tid);
    let st;
    if(c){st=`<div class="lease"><p class="mt"><span class="tag t-g">✅ مؤجّرة</span></p>
      <div class="kv"><span>المستأجر</span><b>${esc(t?t.name:'—')}</b></div>
      <div class="kv"><span>الأجرة</span><b>${money(c.amount)} ${FREQ[c.freq]||''}</b></div>
      <div class="kv"><span>من — إلى</span><b>${fmtDate(c.start)} — ${fmtDate(c.end)}</b></div>
      <p class="mut">لتعديل العقد افتح الوحدة من صفحة العقارات.</p></div>`}
    else{st=`<div class="seg"><button class="${u.lease?'':'on vac'}" onclick="setRent(${k},false)">🔑 شاغرة</button><button class="${u.lease?'on':''}" onclick="setRent(${k},true)">✅ مؤجّرة</button></div>${u.lease?leaseFields(k,u.lease):''}`}
    return`<div class="ucard">
    <div class="row"><span class="uic">${ic(u.type)}</span><input value="${esc(u.name)}" oninput="tmpUnits[${k}].name=this.value"></div>
    <div class="ur2"><select onchange="tmpUnits[${k}].type=this.value;drawUnits()">${opts(UTYPES,u.type)}</select><button class="btn b-r" onclick="rmUnit(${k})">🗑️</button></div>
    ${st}</div>`}).join('')
    :'<p class="card mut">لم تُضف وحدات بعد. إذا حفظت بدون وحدات سيُعتبر العقار وحدة واحدة.</p>';
  tmpUnits.forEach((u,k)=>{if(u.lease)lsum(k)});loadImgs();
}
function leaseFields(k,L){
  const f=(key)=>`oninput="setL(${k},'${key}',this.value)" onchange="setL(${k},'${key}',this.value)"`;
  return`<div class="lease">
  <label>👤 اسم المستأجر</label><input list="tlist" value="${esc(L.tname)}" ${f('tname')} placeholder="اكتب الاسم أو اختر من الموجودين">
  <label>📱 هاتف المستأجر (اختياري)</label><input type="tel" inputmode="tel" value="${esc(L.tphone)}" ${f('tphone')} placeholder="07XXXXXXXX">
  <div class="row2"><div><label>💵 قيمة الأجرة (د.أ)</label><input type="number" inputmode="decimal" value="${esc(L.amount)}" ${f('amount')}></div>
  <div><label>عن</label><select ${f('basis')}>${opts([['y','السنة'],['m','الشهر']],L.basis)}</select></div></div>
  <div class="row2"><div><label>🧾 أجور الخدمات (د.أ)</label><input type="number" inputmode="decimal" value="${esc(L.svc||'')}" ${f('svc')} placeholder="اختياري"></div>
  <div><label>عن</label><select ${f('svcBasis')}>${opts([['y','السنة'],['m','الشهر']],L.svcBasis||'y')}</select></div></div>
  <div class="row2"><div><label>📅 بداية الإيجار</label><input type="date" value="${L.start}" ${f('start')}></div>
  <div><label>📅 نهاية الإيجار</label><input type="date" value="${L.end}" ${f('end')}></div></div>
  <label>🗓️ موعد الدفعات</label><select ${f('freq')}>${opts(FREQ_OPTS,L.freq)}</select>
  <label>طريقة الدفع</label><select ${f('method')}>${opts(['نقدي','شيك','تحويل بنكي'],L.method)}</select>
  <label>📎 صورة أو ملف العقد (PDF)</label>
  ${(L.imgs||[]).length?`<div class="thumbs">${L.imgs.map(x=>attHtml(x)).join('')}</div>`:''}
  <button class="btn b-l full" onclick="document.getElementById('lf${k}').click()">📎 ${(L.imgs||[]).length?'إضافة ملف آخر':'رفع صورة أو ملف PDF (كاميرا / معرض / ملفات)'}</button>
  <input type="file" id="lf${k}" accept="${ACCEPT}" multiple hidden onchange="leaseImgs(${k},this)">
  <div class="card soft mt" id="lsum${k}"></div>
  <button class="btn b-l full" onclick="clearLease(${k})">🧹 مسح بيانات الإيجار</button></div>`;

function setRent(k,on){if(on)tmpUnits[k].lease=defLease();else delete tmpUnits[k].lease;drawUnits()}
function setL(k,key,v){tmpUnits[k].lease[key]=key==='freq'?+v:v;lsum(k)}
function leasePlan(L){
  const fr=+L.freq||1,amt=+L.amount||0;
  const per=Math.round((L.basis==='m'?amt*fr:amt*fr/12)*1000)/1000,sv=+L.svc||0;
  const svcPer=Math.round((L.svcBasis==='m'?sv*fr:sv*fr/12)*1000)/1000;
  const dues=[];let d=L.start;
  if(L.start&&L.end&&L.end>L.start){let k=0;while(d<L.end&&k<600){dues.push(d);k++;d=addMonths(L.start,k*fr)}}
  return{per,svcPer,dues};
}
function lsum(k){
  const el=document.getElementById('lsum'+k);if(!el)return;
  const L=tmpUnits[k].lease,{per,svcPer,dues}=leasePlan(L);
  if(!(L.end>L.start)){el.innerHTML='<b style="color:var(--red)">⚠️ تاريخ النهاية يجب أن يكون بعد البداية</b>';return}
  el.innerHTML=`<b>📌 ملخص الإيجار</b><p>مدة الإيجار: <b>${durTxt(monthsBetween(L.start,L.end))}</b></p>
  <p>عدد الدفعات: <b>${dues.length}</b> — كل دفعة <b>${money(per+svcPer)}</b></p>${svcPer?`<p class="mut">(إيجار ${money(per)} + خدمات ${money(svcPer)})</p>`:''}<p>قيمة العقد كاملة: <b>${money((per+svcPer)*dues.length)}</b></p>
  <p class="mut">مواعيد الدفعات: ${dues.slice(0,6).map(fmtDate).join(' ، ')}${dues.length>6?' ...':''}</p>`;
}
function monthsBetween(a,b){return Math.max(1,Math.round(days(a,b)/30.44))}
function addUnits(){
  const type=val('f_type'),n=Math.min(200,Math.max(1,+val('f_cnt')||1)),floor=val('f_floor');
  const ex=tmpUnits.filter(u=>u.type===type).length;
  for(let k=0;k<n;k++){const u={id:uid(),type,floor,name:type+' '+(ex+k+1)};if(addRented)u.lease=defLease();tmpUnits.push(u)}
  drawUnits();toast(`تمت إضافة ${n} × ${type}`+(addRented?' — عبّئ بيانات الإيجار بالأسفل 👇':''));
}
function rmUnit(k){
  const u=tmpUnits[k];
  if(D.contracts.some(c=>c.uid===u.id)){toast('لهذه الوحدة عقود — احذف عقودها أولاً');return}
  tmpUnits.splice(k,1);drawUnits();
}
function getTenant(name,phone){
  name=name.trim();let t=D.tenants.find(x=>x.name.trim()===name);
  if(!t){t={id:uid(),name,phone:phone||'',notes:''};D.tenants.push(t)}else if(phone&&!t.phone)t.phone=phone;
  return t.id;
}
function buildContract(o){
  const c={id:uid(),pid:o.pid,uid:o.uid,tid:o.tid,start:o.start,end:o.end,months:monthsBetween(o.start,o.end),freq:o.freq,amount:o.amount,method:o.method,bank:o.bank||'',imgs:o.imgs||[],svc:o.svc||0,raw:o.raw||null};
  o.dues.forEach((d,k)=>D.inst.push({id:uid(),cid:c.id,due:d,amount:Math.round((o.amount+(o.svc||0))*1000)/1000,svc:o.svc||0,method:o.method,checkNo:(o.checks||[])[k]||'',bank:c.bank,paid:false}));
  D.contracts.push(c);return o.dues.length;
}
function saveProp(id){
  const name=val('f_name');if(!name){toast('اكتب اسم العقار');return}
  for(const u of tmpUnits){if(!u.lease)continue;const e=leaseErr(u.lease,u.name||u.type);if(e){toast(e);return}}
  const leases=tmpUnits.filter(u=>u.lease);
  let units=tmpUnits.map(u=>{const x={...u,name:String(u.name).trim()||u.type};delete x.lease;return x});
  if(!units.length)units=[{id:uid(),type:'أخرى',floor:'',name:'العقار كاملاً'}];
  let p=id?P(id):null;
  if(p){p.name=name;p.address=val('f_addr');p.units=units}
  else{p={id:uid(),name,address:val('f_addr'),units};D.props.push(p)}
  p.masq=+val('f_masq')||0;p.maaref=+val('f_maaref')||0;
  let n=0;
  leases.forEach(u=>{const L=u.lease,{per,svcPer,dues}=leasePlan(L);
    n+=buildContract({pid:p.id,uid:u.id,tid:getTenant(L.tname,L.tphone),start:L.start,end:L.end,freq:+L.freq,amount:per,svc:svcPer,method:L.method,dues,imgs:L.imgs,raw:{a:L.amount,b:L.basis,s:L.svc,sb:L.svcBasis}})});
  save();closeSheet();toast('تم حفظ العقار ✅'+(leases.length?` — ${leases.length} عقد و ${n} دفعة`:''));go('props');
}
function delProp(id){
  const cs=D.contracts.filter(c=>c.pid===id);
  if(!confirm('حذف العقار'+(cs.length?' وكل عقوده ودفعاته وإجراءاته':'')+'؟'))return;
  const ids=cs.map(c=>c.id);cs.forEach(c=>(c.imgs||[]).forEach(imgDel));
  D.inst=D.inst.filter(i=>!ids.includes(i.cid));D.contracts=D.contracts.filter(c=>c.pid!==id);
  D.legal=D.legal.filter(l=>l.pid!==id);D.props=D.props.filter(p=>p.id!==id);
  save();render();toast('تم الحذف');
}

      <div class="kv"><span>قيمة الدفعة</span><b>${money(c.amount)} ${FREQ[c.freq]}</b></div>
      ${c.svc?`<div class="kv"><span>أجور الخدمات</span><b>${money(c.svc)} ${FREQ[c.freq]}</b></div>`:''}
      <div class="kv"><span>قيمة العقد كاملة</span><b>${money(total)}</b></div>
      <div class="kv"><span>طريقة الدفع</span><b>${esc(c.method)}</b></div>
      <button class="btn b-g full big" onclick="contractEdit('${c.id}')">✏️ تعديل العقد (الأجرة، المدة، طريقة الدفع...)</button>
      <div class="btns"><button class="btn b-r" onclick="endContract('${c.id}')">🚪 إنهاء العقد / إخلاء</button></div></div>
    ${imgsBlock(c)}
    <div class="sec">💰 وضع الدفعات</div>
    <div class="stats">
      <div class="stat"><span>✅ المستلم</span><b>${money(sum(paid,i=>i.paidAmount))}</b><span>${paid.length} دفعة</span></div>
      <div class="stat red"><span>⚠️ المتأخر</span><b>${money(sum(late,i=>i.amount))}</b><span>${late.length} دفعة</span></div>
      <div class="stat org"><span>⏳ الباقي</span><b>${money(sum(rest,i=>i.amount))}</b><span>${rest.length} دفعة</span></div>
      <div class="stat gold"><span>📅 الدفعة القادمة</span><b>${rest[0]?fmtDate(rest[0].due):'—'}</b><span>${rest[0]?money(rest[0].amount):''}</span></div></div>
    <div class="bar"><i style="width:${total?sum(paid,i=>i.amount)/total*100:0}%"></i></div>

  }else{

  }
  const ls=D.legal.filter(l=>l.uid===unitId).sort((a,b)=>b.date.localeCompare(a.date));
  h+=`<div class="sec">⚖️ الإجراءات القانونية (${ls.length})</div>${ls.map(legalCard).join('')}
  <button class="btn b-gold full big" onclick="legalForm('${pid}','${unitId}')">➕ إجراء قانوني (إنذار، دعوى...)</button>`;
  const old=D.contracts.filter(x=>x.uid===unitId&&x!==c);

function endContract(cid){
  if(!confirm('إنهاء العقد اليوم وإخلاء الوحدة؟\nستُحذف الدفعات القادمة غير المستحقة، وتبقى الدفعات المتأخرة مسجّلة على المستأجر.'))return;
  const c=C(cid),td=today();c.end=td;
  D.inst=D.inst.filter(i=>!(i.cid===cid&&!i.paid&&i.due>=td));
  after('تم إنهاء العقد — الوحدة الآن شاغرة');
}

/* ========== التعديل ========== */
const r3=x=>Math.round(x*1000)/1000;
function contractEdit(cid){
  const c=C(cid);if(!c)return;const t=T(c.tid),p=P(c.pid),u=p&&p.units.find(x=>x.id===c.uid);if(!u)return;
  const R=c.raw||{a:String(r3(c.amount*12/c.freq)),b:'y',s:c.svc?String(r3(c.svc*12/c.freq)):'',sb:'y'};
  const L={tname:t?t.name:'',tphone:t?t.phone:'',amount:R.a,basis:R.b,svc:R.s,svcBasis:R.sb,freq:c.freq,start:c.start,end:c.end,method:c.method,imgs:[...(c.imgs||[])]};
  tmpUnits=[{...u,lease:L}];ctx=()=>unitDetail(c.pid,c.uid);
  const paidN=D.inst.filter(i=>i.cid===cid&&i.paid).length;
  openSheet('تعديل العقد — '+u.name,`<div class="card soft"><div class="nm">${ic(u.type)} ${esc(u.name)}</div><div class="mut">🏢 ${esc(p.name)}</div>
  <p class="mt">ℹ️ ${paidN?`الدفعات المدفوعة (${paidN}) تبقى كما هي، و`:''}الدفعات غير المدفوعة يُعاد حسابها حسب التعديل.</p></div>
  <datalist id="tlist">${D.tenants.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
  <div id="rentBox">${leaseFields(0,L)}</div>
  <button class="btn b-g full big" onclick="saveContractEdit('${cid}')">💾 حفظ التعديلات</button>
  <button class="btn b-l full" onclick="unitDetail('${c.pid}','${c.uid}')">↩️ إلغاء ورجوع</button>`);
  lsum(0);loadImgs();
}
function saveContractEdit(cid){
  const L=tmpUnits[0].lease,e=leaseErr(L,tmpUnits[0].name);if(e){toast(e);return}
  if(!confirm('حفظ التعديلات على العقد؟'))return;
  const c=C(cid),{per,svcPer,dues}=leasePlan(L);
  const oT=T(c.tid),nn=L.tname.trim();
  if(oT&&nn!==oT.name&&!D.tenants.some(x=>x.name===nn)&&D.contracts.filter(x=>x.tid===oT.id).length===1)oT.name=nn;else c.tid=getTenant(nn,L.tphone);
  if(L.tphone)T(c.tid).phone=L.tphone;
  Object.assign(c,{start:L.start,end:L.end,months:monthsBetween(L.start,L.end),freq:+L.freq,amount:per,svc:svcPer,method:L.method,imgs:L.imgs||[],raw:{a:L.amount,b:L.basis,s:L.svc,sb:L.svcBasis}});
  const lastPaid=D.inst.filter(i=>i.cid===cid&&i.paid).reduce((m,i)=>i.due>m?i.due:m,'');
  const old={};D.inst.filter(i=>i.cid===cid&&!i.paid).forEach(i=>old[i.due]=i);
  D.inst=D.inst.filter(i=>!(i.cid===cid&&!i.paid));
  let n=0;
  dues.filter(d=>d>lastPaid).forEach(d=>{const o=old[d]||{};D.inst.push({id:uid(),cid,due:d,amount:r3(per+svcPer),svc:svcPer,method:L.method,checkNo:o.checkNo||'',bank:o.bank||'',paid:false});n++});
  after(`تم حفظ تعديلات العقد ✅ — ${n} دفعة قادمة`);
}

  <label>المبلغ (د.أ)</label><input id="ie_a" type="number" inputmode="decimal" value="${i.amount}">
  <label>طريقة الدفع</label><select id="ie_m">${opts(['نقدي','شيك','تحويل بنكي','محفظة إلكترونية'],i.method)}</select>

function contractCard(c){
  const t=T(c.tid),p=P(c.pid),ins=D.inst.filter(i=>i.cid===c.id),pd=ins.filter(i=>i.paid).length;
  const dl=days(today(),c.end);

/* ========== صور العقود ========== */
let _db;
function idb(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('amlaki_imgs',1);r.onupgradeneeded=()=>r.result.createObjectStore('i');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function imgPut(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('i','readwrite');tx.objectStore('i').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function imgGet(k){const db=await idb();return new Promise(res=>{const r=db.transaction('i').objectStore('i').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)})}
async function imgDel(k){try{const db=await idb();db.transaction('i','readwrite').objectStore('i').delete(k)}catch(e){}}
function compress(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1600/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function storeFiles(inp){
  const keys=[];toast('جارٍ حفظ الملف...');
  for(const f of inp.files){try{
    const k='img_'+uid();
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      if(f.size>15*1024*1024){toast('ملف PDF كبير جداً (الحد 15 ميغا)');continue}
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
      await imgPut(k,{pdf:true,name:f.name,data});
    }else await imgPut(k,await compress(f));
    keys.push(k)}catch(e){toast('تعذّر حفظ أحد الملفات')}}
  inp.value='';return keys;
}
const ACCEPT='image/*,application/pdf,.pdf';
function attHtml(k,cid){return`<div class="att" data-k="${k}" onclick="viewImg('${k}'${cid?`,'${cid}'`:''})"></div>`}
function loadImgs(){document.querySelectorAll('.att[data-k]:not(.ld)').forEach(async el=>{el.classList.add('ld');const d=await imgGet(el.dataset.k);
  if(!d){el.textContent='—';return}
  if(typeof d==='object'&&d.pdf){el.classList.add('pdf');el.innerHTML=`<span>📄</span><small class="notr">${esc(d.name||'PDF')}</small>`}
  else el.innerHTML=`<img src="${d}" alt="">`})}
async function leaseImgs(k,inp){
  const keys=await storeFiles(inp),L=tmpUnits[k].lease;L.imgs=(L.imgs||[]).concat(keys);
  if(document.getElementById('ulist'))drawUnits();
  else{document.getElementById('rentBox').innerHTML=leaseFields(0,L);lsum(0);loadImgs()}
  if(keys.length)toast(`تم إرفاق ${keys.length} ملف ✅`);
}
async function addContractImgs(cid,inp){
  const keys=await storeFiles(inp);if(!keys.length)return;
  const c=C(cid);c.imgs=(c.imgs||[]).concat(keys);save();if(ctx)ctx();toast(`تم رفع ${keys.length} ملف للعقد ✅`);
}
function imgsBlock(c){
  const im=c.imgs||[];
  return`<div class="sec">📎 صور وملفات العقد (${im.length})</div><div class="card">
  ${im.length?`<div class="thumbs">${im.map(k=>attHtml(k,c.id)).join('')}</div><p class="mut mt">اضغط على الملف لفتحه</p>`:'<p class="mut">لم يُرفع أي ملف للعقد بعد</p>'}

  <input type="file" id="cimg" accept="${ACCEPT}" multiple hidden onchange="addContractImgs('${c.id}',this)"></div>`;
}
function dataToBlob(u){const[hd,b]=u.split(',');const m=(hd.match(/:(.*?);/)||[0,'application/pdf'])[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}
async function viewImg(k,cid){
  const d=await imgGet(k),v=document.getElementById('vImg'),pb=document.getElementById('vPdf'),del=document.getElementById('vDel');
  if(d&&typeof d==='object'&&d.pdf){v.style.display='none';pb.style.display='';

  else{pb.style.display='none';v.style.display='';v.src=d||'';v.classList.remove('z')}

async function openPdf(k){awayOk=true;const d=await imgGet(k);if(APP){APP.openFile(d.name||'contract.pdf',d.data.split(',')[1],'application/pdf');return}const b=dataToBlob(d.data),w=window.open(URL.createObjectURL(b),'_blank');if(!w)download(d.name||'contract.pdf',b)}
async function savePdf(k){const d=await imgGet(k);download(d.name||'contract.pdf',dataToBlob(d.data))}

const TRIAL_DAYS=7,VENDOR='962779221235',LIC_KEY='amlaki_lic';
const LIC_PUB={"kty":"EC","crv":"P-256","x":"HVzlhWveX_Z0hrTjwIUoTLliaeosFug-gQpMaYJIOZo","y":"5NJb4KDFNHIxR1FDRUBo11JklJ1UygG5cOK03t5SGlQ"};
const DEV_AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function licLoad(){let L;try{L=JSON.parse(localStorage.getItem(LIC_KEY))}catch(e){}
  if(!L||!L.dev){const a=new Uint32Array(8);crypto.getRandomValues(a);L={dev:[...a].map(n=>DEV_AB[n%DEV_AB.length]).join(''),first:today(),last:today()};localStorage.setItem(LIC_KEY,JSON.stringify(L))}
  return L}
let LIC=licLoad();
function licSave(){localStorage.setItem(LIC_KEY,JSON.stringify(LIC))}
const devFmt=()=>LIC.dev.slice(0,4)+'-'+LIC.dev.slice(4);
function licToday(){const t=today();if(t>LIC.last){LIC.last=t;licSave()}return LIC.last>t?LIC.last:t}
function b64uDec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
/* رموز التفعيل القصيرة (6 أرقام) */
const _sk=['1ebc75622309b711','84a59ad218ce4cf4','537b46ae5f8ac421','301edc44abca4c1a'].map(s=>s.split('').reverse().join('')).join('');
async function shortCode(dev,plan,n){
  const key=await crypto.subtle.importKey('raw',Uint8Array.from(_sk.match(/../g).map(x=>parseInt(x,16))),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const s=new Uint8Array(await crypto.subtle.sign('HMAC',key,new TextEncoder().encode('AMLAKI-S|'+dev+'|'+plan+'|'+n)));
  const o=s[s.length-1]&15;const v=((s[o]&127)<<24|s[o+1]<<16|s[o+2]<<8|s[o+3])%1000000;
  return String(v).padStart(6,'0');
}
async function licVerify(code){
  try{
    const digits=String(code).replace(/[\s\-]/g,'');
    if(/^\d{6}$/.test(digits)){
      if((LIC.used||[]).includes(digits))return'USED';
      for(const plan of['1','2','L'])for(let n=1;n<=20;n++){
        if(await shortCode(LIC.dev,plan,n)===digits){if(plan==='L')return'L';const t=licToday(),base=LIC.exp&&LIC.exp!=='L'&&LIC.exp>t?LIC.exp:t;return addMonths(base,12*(+plan))}
      }
      return null;
    }
    code=String(code).replace(/\s+/g,'');const m=code.match(/^(L|\d{8})\.([A-Za-z0-9_-]{80,90})$/);if(!m)return null;
    const key=await crypto.subtle.importKey('jwk',LIC_PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,b64uDec(m[2]),new TextEncoder().encode('AMLAKI1|'+LIC.dev+'|'+m[1]));
    if(!ok)return null;
    return m[1]==='L'?'L':m[1].slice(0,4)+'-'+m[1].slice(4,6)+'-'+m[1].slice(6);
  }catch(e){return null}
}
function licState(){
  const t=licToday();
  if(LIC.exp){if(LIC.exp==='L')return{st:'active',life:true};if(t<=LIC.exp)return{st:'active',exp:LIC.exp,left:days(t,LIC.exp)};return{st:'expired',was:'sub'}}
  const left=TRIAL_DAYS-days(LIC.first,t);
  return left>0?{st:'trial',left}:{st:'expired',was:'trial'};
}

  const exp=await licVerify(code);

  const digits=code.replace(/[\s\-]/g,'');

function cStats(c){
  const td=today(),ins=D.inst.filter(i=>i.cid===c.id).sort((a,b)=>a.due.localeCompare(b.due));
  const late=ins.filter(i=>!i.paid&&i.due<td),rest=ins.filter(i=>!i.paid&&i.due>=td);
  return{ins,paid:sum(ins.filter(i=>i.paid),i=>i.paidAmount),late:sum(late,i=>i.amount),rest:sum(rest,i=>i.amount),total:sum(ins,i=>i.amount)};
}

function taxPay(pid,y){

/* ========== اللغة الإنجليزية ========== */
let LANG='ar',TRX=null;
const AR_RE=/[؀-ۿ]/;
function buildTrx(){const L='\\u0620-\\u065F\\u066E-\\u06D3';const keys=Object.keys(EN).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  TRX=new RegExp('(?<!['+L+'])('+keys.join('|')+')(?!['+L+'])','g')}
function tx(s){
  if(LANG!=='en'||!s||!AR_RE.test(s))return s;
  if(!TRX)buildTrx();
  return s.replace(TRX,m=>EN[m]).replace(/د\.أ/g,'JD').replace(/،/g,',').replace(/؟/g,'?').replace(/«|»/g,'"');
}
const TSKIP={SCRIPT:1,STYLE:1,TEXTAREA:1};
const TATTR=['placeholder','title','aria-label'];
function trNode(n){
  if(n.nodeType===3){const p=n.parentNode;if(!p||TSKIP[p.nodeName]||(p.closest&&p.closest('.notr')))return;
    const s=n.data;if(!AR_RE.test(s))return;const t=tx(s);if(t!==s){n.__ar=s;n.data=t}}
  else if(n.nodeType===1&&!TSKIP[n.nodeName]){
    for(const a of TATTR){const v=n.getAttribute(a);if(v&&AR_RE.test(v)){n['__ar_'+a]=v;n.setAttribute(a,tx(v))}}
    n.childNodes.forEach(trNode);
  }
}
function unNode(n){
  if(n.nodeType===3){if(n.__ar!==undefined){n.data=n.__ar;delete n.__ar}}
  else if(n.nodeType===1){for(const a of TATTR)if(n['__ar_'+a]){n.setAttribute(a,n['__ar_'+a]);delete n['__ar_'+a]}n.childNodes.forEach(unNode)}

function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;s='amlaki#'+s;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
let cur='owner';
const users=()=>D.settings.users||(D.settings.users=[]);
const isOwner=()=>cur==='owner';
const userBy=id=>users().find(u=>u.id===id);
function nameOf(id){return id==='owner'?(D.settings.owner||''):((userBy(id)||{}).name||'')}
function pwOf(id){return id==='owner'?D.settings.pw:(userBy(id)||{}).pw}
const LB=()=>document.getElementById('lockBody');
function lockOpen(){document.getElementById('lock').classList.add('open');document.getElementById('lock').scrollTop=0}
function enterApp(){document.getElementById('lock').classList.remove('open');updateHeader();render();licCheck()}
function lErr(m){const e=document.getElementById('lerr');if(!e){toast(m);return}e.textContent=m;const b=document.querySelector('.lbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
function togglePw(on){document.querySelectorAll('input.pw').forEach(e=>e.type=on?'text':'password')}
const showPwChk='<label class="chk"><input type="checkbox" onchange="togglePw(this.checked)"> إظهار كلمة السر</label>';
function updateHeader(){
  const d=new Date().toLocaleDateString(LANG==='en'?'en-GB':'ar-JO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const n=nameOf(cur);document.getElementById('hdrDate').textContent=(n?'أهلاً '+n+' • ':'')+d;
}
function pwCheck(p1,p2){if(p1.length<4)return'كلمة السر يجب أن تكون 4 أحرف أو أرقام على الأقل';if(p1!==p2)return'كلمتا السر غير متطابقتين';return''}

/* --- الإعداد لأول مرة --- */
function showSetup(){
  LB().innerHTML=`<p class="mut">أهلاً بك! جهّز التطبيق في خطوة واحدة</p>
  <label>👤 اسم صاحب التطبيق</label><input id="s_n" value="${esc(D.settings.owner||'')}" placeholder="الاسم الكامل">
  <label>📱 رقم واتساب صاحب التطبيق</label><input id="s_ph" type="tel" inputmode="tel" placeholder="07XXXXXXXX">
  <p class="mut">يُستعمل لاستعادة كلمة السر إذا نسيتها.</p>
  <label>🔒 كلمة السر</label><input id="s_p1" class="pw" type="password" placeholder="4 أحرف أو أرقام على الأقل">
  <label>🔒 أعد كتابة كلمة السر</label><input id="s_p2" class="pw" type="password">
  ${showPwChk}<div class="lerr" id="lerr"></div>
  <button class="btn b-g full big" onclick="doSetup()">✅ متابعة</button>`;
  lockOpen();
}
function doSetup(){
  const n=val('s_n'),ph=val('s_ph'),p1=val('s_p1'),e=pwCheck(p1,val('s_p2'));
  if(!n){lErr('اكتب اسم صاحب التطبيق');return}
  if(ph.replace(/\D/g,'').length<9){lErr('اكتب رقم واتساب صحيح');return}
  if(e){lErr(e);return}
  D.settings.owner=n;D.settings.ownerPhone=ph;D.settings.pw=hash(p1);cur='owner';
  const code=newRecovery();
  LB().innerHTML=recHtml(code)+`<button class="btn b-g full big" onclick="enterApp();toast('أهلاً ${esc(n)} 👋')">✅ أرسلت الرمز — ادخل إلى التطبيق</button>`;
}

/* --- رمز الاستعادة عبر واتساب --- */
function genCode(){const a=new Uint32Array(2);crypto.getRandomValues(a);return String(a[0]%10000).padStart(4,'0')+'-'+String(a[1]%10000).padStart(4,'0')}
function newRecovery(){const code=genCode();D.settings.rec=hash(code.replace(/\D/g,''));D.settings.recDate=today();save();return code}
function recHtml(code){
  return`<div class="card soft"><p class="nm">🔑 رمز استعادة كلمة السر</p><div class="code">${code}</div>
  <p>أرسل هذا الرمز الآن إلى واتساب الخاص بك واحتفظ بالرسالة.</p>
  <p class="mut">إذا نسيت كلمة السر، افتح الرسالة واكتب الرمز لإنشاء كلمة سر جديدة.</p></div>
  <button class="btn b-w full big" onclick="sendRec('${code}')">📲 أرسل الرمز إلى واتساب ${esc(D.settings.ownerPhone||'')}</button>`;
}
function sendRec(code){
  const ph=D.settings.ownerPhone,msg=`🔑 رمز استعادة كلمة السر لتطبيق «أملاكي»:\n${code}\n\nاحتفظ بهذه الرسالة ولا تشاركها مع أحد.`;
  openExt('https://wa.me/'+(ph?waNum(ph):'')+'?text='+encodeURIComponent(msg));
}
function recSheet(){
  if(D.settings.rec&&!confirm('سيتم إلغاء الرمز القديم وإنشاء رمز جديد. متابعة؟'))return;
  if(!D.settings.ownerPhone){toast('أضف رقم واتساب صاحب التطبيق أولاً');return}
  openSheet('رمز الاستعادة',recHtml(newRecovery())+`<button class="btn b-l full" onclick="settings()">↩️ رجوع إلى الإعدادات</button>`);
}

/* --- شاشة الدخول --- */
let tries=0,waitUntil=0;
function showLock(){
  if(!D.settings.pw){showSetup();return}
  closeViewer();closeRep();
  LB().innerHTML=`<p class="nm">أهلاً بك 👋</p><p class="mut">أدخل اسم المستخدم وكلمة السر</p>
  <label>👤 اسم المستخدم</label><input id="l_name" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')document.getElementById('l_pw').focus()">
  <label>🔒 كلمة السر</label>
  <input id="l_pw" class="pw bigin" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')doUnlock()">
  ${showPwChk}<div class="lerr" id="lerr"></div>
  <button class="btn b-g full big" onclick="doUnlock()">🔓 دخول</button>
  ${bioUser()&&bioOK()?'<button class="btn b-gold full big" onclick="bioLogin()">👆 الدخول بالبصمة</button>':''}
  <div class="btns"><button class="btn b-l" onclick="forgotPw()">🔑 نسيت كلمة السر؟</button><button class="btn b-l" onclick="newUserForm()">👤 مستخدم جديد</button></div>
  <div class="btns" style="margin-top:18px"><button class="btn b-l notr" onclick="setLang(LANG==='en'?'ar':'en');showLock()">🌐 ${LANG==='en'?'العربية':'English'}</button></div>`;
  lockOpen();if(bioUser()&&bioOK()&&!document.hidden)setTimeout(bioLogin,400);else setTimeout(()=>{const e=document.getElementById('l_name');if(e)e.focus()},200);
}
function tooMany(){if(Date.now()<waitUntil){lErr(`محاولات كثيرة — انتظر ${Math.ceil((waitUntil-Date.now())/1000)} ثانية`);return true}return false}
function badTry(msg){tries++;if(tries>=5){tries=0;waitUntil=Date.now()+30000;lErr('5 محاولات خاطئة — انتظر 30 ثانية')}else lErr(`${msg} (${tries} من 5)`)}
function normName(s){return String(s||'').trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[\u064B-\u0652]/g,'').toLowerCase()}
function idByName(n){n=normName(n);if(!n)return null;if(normName(D.settings.owner)===n)return'owner';const u=users().find(x=>normName(x.name)===n);return u?u.id:null}
function doUnlock(){
  if(tooMany())return;
  if(!val('l_name')){lErr('اكتب اسم المستخدم');return}
  const u=idByName(val('l_name'));
  if(u&&hash(val('l_pw'))===pwOf(u)){tries=0;cur=u;enterApp();toast('أهلاً '+nameOf(u)+' 👋');return}
  document.getElementById('l_pw').value='';badTry('اسم المستخدم أو كلمة السر غير صحيحة');
}

/* --- نسيت كلمة السر --- */
function forgotPw(){
  const u=idByName(val('l_name'))||'owner';
  if(u!=='owner'){
    const n=nameOf(u);
    LB().innerHTML=`<div class="card soft"><p class="nm">📲 اطلب إعادة تعيين كلمة السر</p>
    <p>سيُفتح واتساب برسالة جاهزة إلى صاحب التطبيق (${esc(D.settings.owner)}). بعدها يعيّن لك كلمة سر جديدة من الإعدادات.</p></div>
    ${D.settings.ownerPhone?`<button class="btn b-w full big" onclick="askOwner('${u}')">💬 أرسل طلباً إلى صاحب التطبيق</button>`:'<p class="lerr">لم يضف صاحب التطبيق رقم واتساب بعد</p>'}
    <button class="btn b-l full" onclick="showLock()">↩️ رجوع</button>`;
    return;
  }
  LB().innerHTML=`<div class="card soft"><p class="nm">📲 الاستعادة برمز الواتساب</p>
  <p class="mut">افتح واتساب وابحث عن رسالة «رمز استعادة كلمة السر» التي أرسلتها لنفسك، واكتب الرمز هنا.</p></div>
  ${D.settings.rec?`<label>🔑 رمز الاستعادة</label><input id="r_code" class="bigin" inputmode="numeric" placeholder="0000-0000">
  <label>🔒 كلمة السر الجديدة</label><input id="r_p1" class="pw" type="password">
  <label>🔒 أعد كتابتها</label><input id="r_p2" class="pw" type="password">
  ${showPwChk}<div class="lerr" id="lerr"></div>
  <button class="btn b-g full big" onclick="doRecover()">🔑 تعيين كلمة سر جديدة</button>`
  :'<p class="lerr">لم يُنشأ رمز استعادة لهذا التطبيق من قبل.</p>'}
  <button class="btn b-l full" onclick="showLock()">↩️ رجوع</button>
  <button class="btn b-r full" onclick="forgotWipe()">لا أملك الرمز — مسح كل شيء والبدء من جديد</button>`;
}
function askOwner(u){
  const msg=`مرحباً ${D.settings.owner}،\nأنا ${nameOf(u)}، نسيت كلمة السر في تطبيق «أملاكي».\nأرجو إعادة تعيينها لي. شكراً 🌹`;
  openExt('https://wa.me/'+waNum(D.settings.ownerPhone)+'?text='+encodeURIComponent(msg));
}
function doRecover(){
  if(tooMany())return;
  if(hash(val('r_code').replace(/\D/g,''))!==D.settings.rec){badTry('رمز الاستعادة غير صحيح');return}
  const p1=val('r_p1'),e=pwCheck(p1,val('r_p2'));if(e){lErr(e);return}
  tries=0;D.settings.pw=hash(p1);cur='owner';
  const code=newRecovery();
  LB().innerHTML=`<p class="nm" style="color:var(--g)">✅ تم تعيين كلمة السر الجديدة</p><p class="mut">الرمز القديم لم يعد صالحاً — هذا رمزك الجديد:</p>`+recHtml(code)+
    `<button class="btn b-g full big" onclick="enterApp()">✅ ادخل إلى التطبيق</button>`;
}
function forgotWipe(){
  LB().innerHTML=`<div class="card warn"><div class="wic">⚠️</div><p class="nm">مسح كل شيء</p>
  <p>سيتم حذف <b>كل البيانات والمستخدمين</b> والبدء من جديد بكلمة سر جديدة.</p>
  <p>بعدها يمكنك استعادة بياناتك من نسخة احتياطية محفوظة سابقاً.</p></div>
  <button class="btn b-g full big" onclick="showLock()">↩️ رجوع</button>
  <button class="btn b-red full" onclick="resetAll()">🗑️ نعم، امسح كل شيء</button>`;
}
function resetAll(){
  if(!confirm('⚠️ سيتم حذف كل البيانات نهائياً. هل أنت متأكد؟'))return;
  if(!confirm('تأكيد أخير: لا يمكن التراجع!'))return;
  D=EMPTY();save();clearImgs();cur='owner';applyFs();updateHeader();go('home');showSetup();
}

/* --- المستخدمون --- */
function newUserForm(){
  LB().innerHTML=`<p class="nm">👤 مستخدم جديد</p><p class="mut">إضافة مستخدم تحتاج موافقة صاحب التطبيق بكلمة سره.</p>
  <label>اسم المستخدم</label><input id="n_name" placeholder="الاسم">
  <label>رقم هاتفه (اختياري)</label><input id="n_phone" type="tel" inputmode="tel" placeholder="07XXXXXXXX">
  <label>🔒 كلمة السر</label><input id="n_p1" class="pw" type="password" placeholder="4 أحرف أو أرقام على الأقل">
  <label>🔒 أعد كتابتها</label><input id="n_p2" class="pw" type="password">
  <label>🔐 كلمة سر صاحب التطبيق (للموافقة)</label><input id="n_owner" class="pw" type="password">
  ${showPwChk}<div class="lerr" id="lerr"></div>
  <button class="btn b-g full big" onclick="doNewUser(true)">✅ إنشاء المستخدم والدخول</button>
  <button class="btn b-l full" onclick="showLock()">↩️ رجوع</button>`;
}
function userSheet(id){
  const u=id?userBy(id):null;
  openSheet(u?'كلمة سر جديدة لـ '+u.name:'إضافة مستخدم',`
  ${u?'':`<label>اسم المستخدم</label><input id="n_name"><label>رقم هاتفه (اختياري)</label><input id="n_phone" type="tel" inputmode="tel">`}
  <label>🔒 كلمة السر${u?' الجديدة':''}</label><input id="n_p1" class="pw" type="password" placeholder="4 أحرف أو أرقام على الأقل">
  <label>🔒 أعد كتابتها</label><input id="n_p2" class="pw" type="password">
  ${showPwChk}
  <button class="btn b-g full big" onclick="${u?`resetUserPw('${id}')`:'doNewUser(false)'}">💾 حفظ</button>
  <button class="btn b-l full" onclick="settings()">↩️ رجوع إلى الإعدادات</button>`);
}
function doNewUser(fromLock){
  const err=m=>fromLock?lErr(m):toast(m);
  if(fromLock&&tooMany())return;
  const n=val('n_name'),p1=val('n_p1'),e=pwCheck(p1,val('n_p2'));
  if(!n){err('اكتب اسم المستخدم');return}
  if(n===D.settings.owner||users().some(u=>u.name===n)){err('هذا الاسم موجود مسبقاً');return}
  if(e){err(e);return}
  if(fromLock&&hash(val('n_owner'))!==D.settings.pw){badTry('كلمة سر صاحب التطبيق غير صحيحة');return}
  const u={id:uid(),name:n,phone:val('n_phone'),pw:hash(p1)};users().push(u);save();
  if(fromLock){tries=0;cur=u.id;enterApp();toast(`تم إنشاء المستخدم — أهلاً ${n} 👋`)}
  else{settings();toast('تمت إضافة المستخدم ✅')}
}
function resetUserPw(id){
  const p1=val('n_p1'),e=pwCheck(p1,val('n_p2'));if(e){toast(e);return}
  userBy(id).pw=hash(p1);save();settings();toast('تم تعيين كلمة السر ✅ — أبلغ المستخدم بها');
}
function delUser(id){if(!confirm('حذف المستخدم '+nameOf(id)+'؟'))return;D.settings.users=users().filter(u=>u.id!==id);save();settings();toast('تم حذف المستخدم')}

function lockNow(){closeAll();showLock()}
function changePw(){
  const o=val('c_old'),n1=val('c_new'),e=pwCheck(n1,val('c_new2'));
  if(hash(o)!==pwOf(cur)){toast('كلمة السر الحالية غير صحيحة');return}
  if(e){toast(e);return}
  if(isOwner())D.settings.pw=hash(n1);else userBy(cur).pw=hash(n1);
  save();toast('تم تغيير كلمة السر ✅');settings();
}
function saveOwner(){
  const n=val('s_owner'),ph=val('s_ophone');if(!n){toast('اكتب الاسم');return}
  D.settings.owner=n;D.settings.ownerPhone=ph;save();updateHeader();toast('تم الحفظ ✅');
}
/* القفل الفوري عند الخروج من التطبيق أو إطفاء الشاشة */
let hiddenAt=0,awayOk=false;
const isLocked=()=>document.getElementById('lock').classList.contains('open');
document.addEventListener('visibilitychange',()=>{
  if(!D.settings.pw||bioBusy)return;
  if(document.hidden){hiddenAt=Date.now();if(actOpen())awayOk=true;if(!awayOk&&!isLocked())showLock()}
  else{if(awayOk&&Date.now()-hiddenAt>10*60000&&!isLocked())showLock();awayOk=false;
    if(isLocked()&&Date.now()-bioEnd>1500)setTimeout(bioLogin,350)}
});
/* شاشة التفعيل مفتوحة: الخروج لنسخ الرمز من الواتساب لا يُقفل التطبيق */
function actOpen(){return document.getElementById('lic').classList.contains('open')||(document.getElementById('sheet').classList.contains('open')&&!!document.querySelector('#shB #ls_code'))}
async function pasteCode(id){try{const t=await navigator.clipboard.readText();const m=(t||'').match(/(L|\d{8})\.[A-Za-z0-9_-]{80,90}|\d{3}\s*-?\s*\d{3}/);document.getElementById(id).value=m?m[0]:(t||'').trim();toast('تم اللصق ✅')}catch(e){toast('اضغط مطولاً داخل الخانة ثم اختر «لصق»')}}
/* ========== الدخول بالبصمة ========== */
let bioBusy=false,bioEnd=0,bioMode='';
const bioOK=()=>{try{return!!(window.AndroidApp&&AndroidApp.bioAvailable&&AndroidApp.bioAvailable())}catch(e){return false}};
function bioCode(){try{return AndroidApp.bioCode?AndroidApp.bioCode():null}catch(e){return null}}
function bioUser(){const id=D.settings.bioUser;return id&&(id==='owner'||userBy(id))?id:null}
function bioLogin(){
  if(bioBusy||!isLocked()||!bioUser()||!bioOK()||document.hidden)return;
  bioMode='login';bioBusy=true;AndroidApp.bioAuth(tx('الدخول إلى أملاكي'),tx('ضع إصبعك على مستشعر البصمة'),tx('استخدام كلمة السر'));
}
function bioEnable(){
  if(!bioOK()){toast('البصمة غير متاحة على هذا الهاتف');return}
  bioMode='enable';bioBusy=true;AndroidApp.bioAuth(tx('تفعيل الدخول بالبصمة'),tx('ضع إصبعك للتأكيد'),tx('إلغاء'));
}
function bioDisable(){if(!confirm('إيقاف الدخول بالبصمة؟'))return;delete D.settings.bioUser;save();settings();toast('تم إيقاف الدخول بالبصمة')}
window.onBio=(ok,msg)=>{
  bioBusy=false;bioEnd=Date.now();const m=bioMode;bioMode='';
  if(m==='enable'){if(ok){D.settings.bioUser=cur;save();settings();toast('تم تفعيل الدخول بالبصمة ✅')}else toast('لم يتم تفعيل البصمة');return}
  if(ok&&isLocked()){const u=bioUser();if(!u)return;cur=u;tries=0;enterApp();toast('أهلاً '+nameOf(u)+' 👋')}
};
function bioCard(){
  let b;
  if(!window.AndroidApp)b='<p class="mut">متاح في تطبيق الهاتف فقط.</p>';
  else if(!AndroidApp.bioAvailable)b='<p class="lerr">⚠️ نسخة التطبيق المثبّتة قديمة ولا تحتوي البصمة. حدّث ملف build.yml على GitHub، ثم ثبّت أحدث نسخة من Releases.</p>';
  else if(!bioOK()){const c=bioCode();
    b=c===11?'<p class="lerr">⚠️ لا توجد بصمة مسجّلة في الهاتف. أضف بصمتك من: إعدادات الهاتف ← الأمان والخصوصية ← المقاييس الحيوية ← بصمات الأصابع، ثم ارجع هنا.</p>'
     :c===12?'<p class="mut">هذا الهاتف لا يحتوي مستشعر بصمة.</p>'
     :`<p class="lerr">⚠️ البصمة غير متاحة الآن${c!=null?' (رمز '+c+')':''}. تأكد أن البصمة مفعّلة في إعدادات الهاتف.</p>`;}
  else{const on=bioUser();
    b=on===cur?'<p><span class="tag t-g">✅ مفعّل لك</span></p><p class="mut mt">عند فتح التطبيق تظهر نافذة البصمة مباشرة، وتبقى كلمة السر متاحة دائماً.</p><button class="btn b-r full" onclick="bioDisable()">إيقاف الدخول بالبصمة</button>'
     :on?`<p class="mut">البصمة مفعّلة حالياً للمستخدم: <b>${esc(nameOf(on))}</b></p><button class="btn b-g full" onclick="bioEnable()">👆 تفعيلها لي بدلاً منه</button>`
     :'<p class="mut">ادخل ببصمة إصبعك بدل كتابة كلمة السر في كل مرة.</p><button class="btn b-g full big" onclick="bioEnable()">👆 تفعيل الدخول بالبصمة</button>';}
  return`<div class="card"><div class="nm">👆 الدخول بالبصمة</div>${b}</div>`;
}
/* خروج مقصود (اختيار ملف، واتساب، اتصال، طباعة، مشاركة) لا يُقفل التطبيق */
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('input[type=file],a[href^="tel:"],a[href^="http"]');if(t)awayOk=true},true);

/* ========== مسح جميع البيانات ========== */
function clearImgs(){idb().then(db=>db.transaction('i','readwrite').objectStore('i').clear()).catch(()=>{})}
function wipeAsk(){
  ctx=null;
  openSheet('مسح جميع البيانات',`<div class="card warn"><div class="wic">⚠️</div><div class="nm">تحذير مهم!</div>
  <p>سيتم حذف <b>كل</b> البيانات نهائياً:</p>
  <p>🏢 العقارات والوحدات<br>👥 المستأجرين<br>📄 العقود وصورها<br>💰 الدفعات<br>⚖️ الإجراءات القانونية</p>
  <p><b>لا يمكن التراجع عن هذا الإجراء</b>، ولا يمكن استرجاع البيانات إلا من نسخة احتياطية محفوظة.</p></div>
  <button class="btn b-g full big" onclick="exportData()">⬇️ احفظ نسخة احتياطية أولاً (موصى به)</button>
  ${D.settings.pw?'<label>🔒 للتأكيد اكتب كلمة سر صاحب التطبيق</label><input id="w_pw" type="password">':''}
  <button class="btn b-red full big" onclick="doWipe()">🗑️ نعم، امسح كل البيانات</button>
  <button class="btn b-l full big" onclick="closeAll()">✋ إلغاء — لا أريد المسح</button>`);
}
function doWipe(){
  if(!isOwner()){toast('المسح متاح لصاحب التطبيق فقط');return}
  if(D.settings.pw&&hash(val('w_pw'))!==D.settings.pw){toast('كلمة السر غير صحيحة');return}
  if(!confirm('آخر تأكيد: هل أنت متأكد من مسح كل البيانات نهائياً؟'))return;
  const s={...D.settings};delete s.lastBackup;
  D=EMPTY();D.settings=s;save();clearImgs();applyFs();closeAll();go('home');toast('تم مسح كل البيانات');
}

/* ========== تشغيل ========== */
document.querySelectorAll('img.applogo').forEach(i=>i.src=document.getElementById('favicon').href);
applyFs();applyLang();render();
if(!D.settings.pw)showSetup();else showLock();
</script>
</body>
</html>
