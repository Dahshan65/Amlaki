name: Build Amlaki APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > amlaki.jks; echo "Signing key ready"; else echo "No KEYSTORE_B64 secret - using debug key"; fi

      - name: Create Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/dahshan/amlaki app/src/main/assets app/src/main/res/xml app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html
          cp amlak-icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Amlaki'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
          def ks = rootProject.file('amlaki.jks')
          android {
              namespace 'com.dahshan.amlaki'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dahshan.amlaki'
                  minSdk 24
                  targetSdk 34
                  versionCode runNo
                  versionName "1.0.${runNo}"
              }
              signingConfigs {
                  rel {
                      if (ks.exists()) {
                          storeFile ks
                          storePassword 'amlaki2026'
                          keyAlias 'amlaki'
                          keyPassword 'amlaki2026'
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig ks.exists() ? signingConfigs.rel : signingConfigs.debug
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application
                  android:label="أملاكي"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|smallestScreenSize|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
          </paths>
          EOF

          cat > app/src/main/java/com/dahshan/amlaki/MainActivity.java <<'EOF'
          package com.dahshan.amlaki;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.hardware.biometrics.BiometricManager;
          import android.hardware.biometrics.BiometricPrompt;
          import android.os.CancellationSignal;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;

          public class MainActivity extends Activity {
              private static final String HOME = "https://appassets.androidplatform.net/assets/index.html";
              private static final int PICK = 77;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private Uri camUri;
              private File camFile;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(0xFF0F5C4D);
                  web = new WebView(this);
                  setContentView(web);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(true);
                  s.setTextZoom(100);

                  web.addJavascriptInterface(new Bridge(), "AndroidApp");

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                          openExternal(u.toString());
                          return true;
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          return pickFiles(cb, p);
                      }
                  });

                  web.loadUrl(HOME);
              }

              private boolean pickFiles(ValueCallback<Uri[]> cb, WebChromeClient.FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  camUri = null;
                  camFile = null;
                  LinkedHashSet<String> mimes = new LinkedHashSet<>();
                  boolean any = false, img = false;
                  for (String a : p.getAcceptTypes()) {
                      for (String t : a.split(",")) {
                          t = t.trim().toLowerCase();
                          if (t.isEmpty()) continue;
                          if (t.startsWith("image")) img = true;
                          if (t.contains("json")) any = true;
                          else if (t.equals(".pdf")) mimes.add("application/pdf");
                          else if (t.startsWith(".")) any = true;
                          else mimes.add(t);
                      }
                  }
                  Intent get = new Intent(Intent.ACTION_GET_CONTENT);
                  get.addCategory(Intent.CATEGORY_OPENABLE);
                  get.setType("*/*");
                  if (!any && !mimes.isEmpty()) get.putExtra(Intent.EXTRA_MIME_TYPES, mimes.toArray(new String[0]));
                  if (p.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE) get.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                  Intent chooser = Intent.createChooser(get, "اختر ملفاً");
                  if (img) {
                      try {
                          camFile = new File(getCacheDir(), "cam_" + System.currentTimeMillis() + ".jpg");
                          camUri = FileProvider.getUriForFile(this, getPackageName() + ".files", camFile);
                          Intent cam = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                          cam.putExtra(MediaStore.EXTRA_OUTPUT, camUri);
                          cam.setClipData(ClipData.newRawUri("", camUri));
                          cam.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cam});
                      } catch (Exception e) {
                          camUri = null;
                          camFile = null;
                      }
                  }
                  try {
                      startActivityForResult(chooser, PICK);
                  } catch (Exception e) {
                      fileCb = null;
                      cb.onReceiveValue(null);
                      return false;
                  }
                  return true;
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK || fileCb == null) return;
                  ArrayList<Uri> out = new ArrayList<>();
                  if (res == RESULT_OK) {
                      if (data != null && data.getClipData() != null) {
                          for (int i = 0; i < data.getClipData().getItemCount(); i++) out.add(data.getClipData().getItemAt(i).getUri());
                      } else if (data != null && data.getData() != null) {
                          out.add(data.getData());
                      }
                      if (out.isEmpty() && camFile != null && camFile.exists() && camFile.length() > 0) out.add(camUri);
                  }
                  fileCb.onReceiveValue(out.isEmpty() ? null : out.toArray(new Uri[0]));
                  fileCb = null;
              }

              @Override
              public void onBackPressed() {
                  web.evaluateJavascript("(typeof appBack==='function')?appBack():'exit'", r -> {
                      if (r == null || r.contains("exit")) finish();
                  });
              }

              private void startBio(String title, String sub, String cancel) {
                  if (Build.VERSION.SDK_INT < 28) { bioResult(false, "unsupported"); return; }
                  try {
                      java.util.concurrent.Executor ex = getMainExecutor();
                      BiometricPrompt bp = new BiometricPrompt.Builder(this)
                              .setTitle(title)
                              .setSubtitle(sub)
                              .setNegativeButton(cancel, ex, (d, w) -> bioResult(false, "cancel"))
                              .build();
                      bp.authenticate(new CancellationSignal(), ex, new BiometricPrompt.AuthenticationCallback() {
                          @Override
                          public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) { bioResult(true, ""); }
                          @Override
                          public void onAuthenticationError(int code, CharSequence msg) { bioResult(false, String.valueOf(msg)); }
                      });
                  } catch (Exception e) {
                      bioResult(false, "error");
                  }
              }

              private void bioResult(boolean ok, String msg) {
                  String m = msg == null ? "" : msg.replace("\\", " ").replace("'", " ").replace("\n", " ");
                  web.evaluateJavascript("window.onBio&&onBio(" + ok + ",'" + m + "')", null);
              }

              private void toast(String m) {
                  Toast.makeText(this, m, Toast.LENGTH_LONG).show();
              }

              private void openExternal(String u) {
                  try {
                      Intent i = u.startsWith("intent:") ? Intent.parseUri(u, Intent.URI_INTENT_SCHEME) : new Intent(Intent.ACTION_VIEW, Uri.parse(u));
                      startActivity(i);
                  } catch (Exception e) {
                      toast("لا يوجد تطبيق لفتح هذا الرابط");
                  }
              }

              private Uri cacheUri(String name, byte[] d) throws Exception {
                  File dir = new File(getCacheDir(), "share");
                  dir.mkdirs();
                  File f = new File(dir, name.replaceAll("[\\\\/:*?\"<>|]", "_"));
                  FileOutputStream os = new FileOutputStream(f);
                  os.write(d);
                  os.close();
                  return FileProvider.getUriForFile(this, getPackageName() + ".files", f);
              }

              private void share(String name, byte[] d, String mime) {
                  try {
                      Uri u = cacheUri(name, d);
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType(mime);
                      i.putExtra(Intent.EXTRA_STREAM, u);
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(i, "مشاركة"));
                  } catch (Exception e) {
                      toast("تعذّرت المشاركة");
                  }
              }

              private void saveDownload(String name, byte[] d, String mime) {
                  if (Build.VERSION.SDK_INT < 29) { share(name, d, mime); return; }
                  try {
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/Amlaki");
                      Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                      OutputStream os = getContentResolver().openOutputStream(u);
                      os.write(d);
                      os.close();
                      toast("✅ تم الحفظ في مجلد التنزيلات / Amlaki\n" + name);
                  } catch (Exception e) {
                      share(name, d, mime);
                  }
              }

              class Bridge {
                  @JavascriptInterface
                  public void openUrl(final String u) {
                      runOnUiThread(() -> openExternal(u));
                  }

                  @JavascriptInterface
                  public void saveFile(final String name, String b64, final String mime) {
                      final byte[] d = Base64.decode(b64, Base64.DEFAULT);
                      runOnUiThread(() -> saveDownload(name, d, mime.isEmpty() ? "application/octet-stream" : mime));
                  }

                  @JavascriptInterface
                  public void shareFile(final String name, String b64, final String mime) {
                      final byte[] d = Base64.decode(b64, Base64.DEFAULT);
                      runOnUiThread(() -> share(name, d, mime));
                  }

                  @JavascriptInterface
                  public void openFile(final String name, String b64, final String mime) {
                      final byte[] d = Base64.decode(b64, Base64.DEFAULT);
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(Intent.ACTION_VIEW);
                              i.setDataAndType(cacheUri(name, d), mime);
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              startActivity(i);
                          } catch (Exception e) {
                              toast("لا يوجد تطبيق لفتح هذا الملف");
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean bioAvailable() {
                      if (Build.VERSION.SDK_INT < 28) return false;
                      if (Build.VERSION.SDK_INT >= 29) {
                          BiometricManager bm = getSystemService(BiometricManager.class);
                          return bm != null && bm.canAuthenticate() == BiometricManager.BIOMETRIC_SUCCESS;
                      }
                      return getPackageManager().hasSystemFeature(PackageManager.FEATURE_FINGERPRINT);
                  }

                  @JavascriptInterface
                  public int bioCode() {
                      if (Build.VERSION.SDK_INT < 28) return -1;
                      if (Build.VERSION.SDK_INT < 29) return 0;
                      BiometricManager bm = getSystemService(BiometricManager.class);
                      return bm == null ? -2 : bm.canAuthenticate();
                  }

                  @JavascriptInterface
                  public void bioAuth(final String title, final String sub, final String cancel) {
                      runOnUiThread(() -> startBio(title, sub, cancel));
                  }

                  @JavascriptInterface
                  public void print(final String title) {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          String t = title == null || title.isEmpty() ? "Amlaki" : title;
                          pm.print(t, web.createPrintDocumentAdapter(t),
                                  new PrintAttributes.Builder().setMediaSize(PrintAttributes.MediaSize.ISO_A4).build());
                      });
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Amlaki-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Amlaki-APK
          path: Amlaki-v1.0.${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: أملاكي v1.0.${{ github.run_number }}
          files: Amlaki-v1.0.${{ github.run_number }}.apk
